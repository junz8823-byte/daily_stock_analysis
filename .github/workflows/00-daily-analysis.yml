name: 每日股票分析

on:
  # 定时触发 - 北京时间每天早上 06:30（对应 UTC 前一天晚上 22:30，周二至周六早晨推送）
  schedule:
    - cron: '30 22 * * 1-5'

  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析 (股票+大盘)
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -c "import futu; print('✅ futu SDK import OK')"

    - name: 创建必要目录
      run: |
        mkdir -p data logs reports

    - name: 执行股票分析
      env:
        # ========================================
        # AI 配置
        # ========================================
        GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
        GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}
        GENERATION_BACKEND_TIMEOUT_SECONDS: ${{ vars.GENERATION_BACKEND_TIMEOUT_SECONDS || secrets.GENERATION_BACKEND_TIMEOUT_SECONDS }}
        GENERATION_BACKEND_MAX_OUTPUT_BYTES: ${{ vars.GENERATION_BACKEND_MAX_OUTPUT_BYTES || secrets.GENERATION_BACKEND_MAX_OUTPUT_BYTES }}
        GENERATION_BACKEND_MAX_CONCURRENCY: ${{ vars.GENERATION_BACKEND_MAX_CONCURRENCY || secrets.GENERATION_BACKEND_MAX_CONCURRENCY }}
        LOCAL_CLI_BACKEND_MAX_CONCURRENCY: ${{ vars.LOCAL_CLI_BACKEND_MAX_CONCURRENCY || secrets.LOCAL_CLI_BACKEND_MAX_CONCURRENCY }}
        AGENT_GENERATION_BACKEND: ${{ vars.AGENT_GENERATION_BACKEND || secrets.AGENT_GENERATION_BACKEND }}
        # LITELLM_CONFIG
        LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
        LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
        LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
        AGENT_LITELLM_MODEL: ${{ vars.AGENT_LITELLM_MODEL || secrets.AGENT_LITELLM_MODEL }}
        VISION_MODEL: ${{ vars.VISION_MODEL || secrets.VISION_MODEL }}

        # ========================================
        # 基础配置
        # ========================================
        STOCK_LIST: ${{ secrets.STOCK_LIST }}
        MARKET: ${{ secrets.MARKET }}
        USE_AKSHARE: ${{ secrets.USE_AKSHARE }}
        USE_TUSHARE: ${{ secrets.USE_TUSHARE }}
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        USE_YFINANCE: ${{ secrets.USE_YFINANCE }}
        USE_FUTU: ${{ secrets.USE_FUTU }}
        FUTU_HOST: ${{ secrets.FUTU_HOST }}
        FUTU_PORT: ${{ secrets.FUTU_PORT }}
        FUTU_PWD_UNLOCK: ${{ secrets.FUTU_PWD_UNLOCK }}

        # ========================================
        # 搜索与新闻
        # ========================================
        TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        BAIDU_SEARCH_API_KEY: ${{ secrets.BAIDU_SEARCH_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

        # ========================================
        # 推送通道
        # ========================================
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        NTFY_URL: ${{ secrets.NTFY_URL }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        ASTRBOT_URL: ${{ secrets.ASTRBOT_URL }}
        ASTRBOT_TOKEN: ${{ secrets.ASTRBOT_TOKEN }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        BARK_URL: ${{ secrets.BARK_URL }}
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
        EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      run: |
        echo "========================================"
        echo " 📋 环境变量检查"
        echo "========================================"
        echo " Stock List: $([ -n "$STOCK_LIST" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " OpenAI API Key: $([ -n "$OPENAI_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " Gemini API Key: $([ -n "$GEMINI_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " DeepSeek API Key: $([ -n "$DEEPSEEK_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " 飞书: $([ -n "$FEISHU_WEBHOOK_URL" ] || ([ -n "$FEISHU_APP_ID" ] && [ -n "$FEISHU_APP_SECRET" ] && [ -n "$FEISHU_CHAT_ID" ]) && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " 企业微信: $([ -n "$WECHAT_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " 钉钉: $([ -n "$DINGTALK_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " Telegram: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo " Discord: $([ -n "$DISCORD_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '❌ 未配置')"
        echo "========================================"
        echo ""

        # 构建命令行参数
        FORCE_RUN_ARG="--force-run"
        if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
          FORCE_RUN_ARG="--force-run"
          echo " ⚡ 已启用强制运行模式（跳过交易日检查）"
        fi

        # 执行分析
        if [ "$MODE" = "market-only" ]; then
          python main.py --market-review $FORCE_RUN_ARG
        elif [ "$MODE" = "stocks-only" ]; then
          python main.py --no-market-review $FORCE_RUN_ARG
        else
          python main.py $FORCE_RUN_ARG
        fi

    - name: 上传分析报告
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: analysis-reports-${{ github.run_number }}
        path: |
          reports/
          logs/
        retention-days: 30

    - name: 显示运行结果
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo " 📊 分析完成"
        echo "========================================"
        if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
          echo "生成的报告:"
          ls -la reports/
        else
          echo " ⚠️ 未生成报告文件"
        fi
        echo ""
        if [ -f "logs/stock_analysis_$(date +%Y%m%d).log" ]; then
          echo " 📜 最近日志 (最后 30 行):"
          tail -30 logs/stock_analysis_*.log 2>/dev/null || echo "无日志"
        fi
